# The built site (dist/), as uploaded by deploy/deploy.sh. The reverse proxy in
# front handles HTTPS and compression.
server {
    listen 80;
    root /srv/site/current;
    index index.html;

    # Bundles have content hashes in their names: they never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /icons/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Pages (/, /overlay/) revalidate, so a deploy shows at once.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
